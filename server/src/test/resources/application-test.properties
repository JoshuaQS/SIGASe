spring.application.name=sigase-test

spring.datasource.url=jdbc:h2:mem:sigase_test_${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=unit-test-secret-should-be-long-enough-1234567890
app.jwt.issuer=test-suite
app.jwt.admin-expiration-seconds=1800
app.jwt.student-expiration-seconds=900

app.auth.lockout.max-failed-attempts=5
app.auth.lockout.duration-minutes=15

app.security.allowed-origins=http://localhost:5173

app.logs.sanitization.hash-ip=false
app.logs.sanitization.mask-ip=true
app.logs.sanitization.user-agent-max-length=160
app.logs.sanitization.url-max-length=400
app.logs.sanitization.metadata-max-length=4000
app.logs.sanitization.email-visible-prefix=2

app.elibro.base-url=https://auth.elibro.net/auth/sso/
app.elibro.encryption-key=12345678901234567890123456789012
app.elibro.allowed-next-hosts[0]=elibro.net
app.elibro.allowed-next-hosts[1]=www.elibro.net

app.google.allowed-domain=utez.edu.mx
app.google.audience[0]=test-client-id

app.seed.admin-email=
app.seed.admin-password=
app.seed.admin-full-name=Administrador TI
app.seed.admin-biblioteca-email=
app.seed.admin-biblioteca-password=
app.seed.admin-biblioteca-full-name=Administrador Biblioteca

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
