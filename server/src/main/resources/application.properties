spring.config.import=optional:file:.env[.properties]
spring.application.name=${APP_NAME}
spring.profiles.default=dev

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.time-zone=UTC

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.issuer=${APP_JWT_ISSUER:sigase}
app.jwt.admin-expiration-seconds=${APP_JWT_ADMIN_EXP_SECONDS}
app.jwt.student-expiration-seconds=${APP_JWT_STUDENT_EXP_SECONDS}

app.auth.lockout.max-failed-attempts=${APP_AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout.duration-minutes=${APP_AUTH_LOCKOUT_DURATION_MINUTES:15}

app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:18080}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

app.logs.sanitization.hash-ip=${APP_LOG_SANITIZE_HASH_IP:false}
app.logs.sanitization.mask-ip=${APP_LOG_SANITIZE_MASK_IP:true}
app.logs.sanitization.user-agent-max-length=${APP_LOG_SANITIZE_USER_AGENT_MAX_LENGTH:160}
app.logs.sanitization.url-max-length=${APP_LOG_SANITIZE_URL_MAX_LENGTH:400}
app.logs.sanitization.metadata-max-length=${APP_LOG_SANITIZE_METADATA_MAX_LENGTH:4000}
app.logs.sanitization.email-visible-prefix=${APP_LOG_SANITIZE_EMAIL_VISIBLE_PREFIX:2}

app.elibro.base-url=${APP_ELIBRO_BASE_URL:https://auth.elibro.net/auth/sso/}
app.elibro.encryption-key=${APP_AES_SECRET}
app.elibro.allowed-next-hosts=${APP_ELIBRO_ALLOWED_HOSTS}

app.google.allowed-domain=${APP_GOOGLE_ALLOWED_DOMAIN}
app.google.audience[0]=${APP_GOOGLE_CLIENT_ID}

app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.admin-full-name=${APP_SEED_ADMIN_FULL_NAME:Administrador TI}

app.seed.admin-biblioteca-email=${APP_SEED_ADMIN_BIBLIOTECA_EMAIL:}
app.seed.admin-biblioteca-password=${APP_SEED_ADMIN_BIBLIOTECA_PASSWORD:}
app.seed.admin-biblioteca-full-name=${APP_SEED_ADMIN_BIBLIOTECA_FULL_NAME:Administrador Biblioteca}
app.seed.dashboard-demo-enabled=${APP_SEED_DASHBOARD_DEMO_ENABLED:false}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}

app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME}}

logging.level.org.springframework.security=${APP_LOG_LEVEL_SPRING_SECURITY:INFO}
logging.level.org.springframework.security.web.FilterChainProxy=${APP_LOG_LEVEL_SPRING_SECURITY_FILTER_CHAIN:WARN}
logging.level.mx.edu.utez.server=${APP_LOG_LEVEL_APP:INFO}
logging.level.mx.edu.utez.server.security.JwtAuthenticationFilter=${APP_LOG_LEVEL_JWT_FILTER:INFO}

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.transaction=INFO
